<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Conversor Moedas</h2>
        <label>Digite o valor Para a Conversão:</label> 
        <input type="text" id="valor">  <br>
        <label>Origem:</label>
        <select id="origem">
            <option value="D">Dolar</option>
            <option value="E">Euro</option>
            <option value="K">Kwanza</option>
            <option value="F">Francos Sueco</option>
        </select> 
        <label>Destino:</label>
        <select id="destino">
            <option value="D">Dolar</option>
            <option value="E">Euro</option>
            <option value="K">Kwanza</option>
            <option value="F">Francos Sueco</option>
        </select><br>
        <label>Resultados:</label><br>
        <input type="text" id="resultadoD">
        <input type="text" id="resultadoE">
        <input type="text" id="resultadoF">
        <input type="text" id="resultadoK">
    </div>
</body>
</html>
