<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <div class="container">
        <input type="text" name="texto" id="texto">
        <div class="botoes">
            <div class="first-line">
                <button class="especial">AC</button>
                <button id="limpar" class="especial">C</button>
                <button>%</button>
                <button class="operador">%</button>
            </div>
            <div class="secund-line">
                <button onclick="adicionarNumero" class="numero">7</button>
                <button onclick="adicionarNumero" class="numero">8</button>
                <button onclick="adicionarNumero" class="numero">9</button>
                <button class="operador">x</button>
            </div>
            <div class="thirt-line">
                <button onclick="adicionarNumero" class="numero">4</button>
                <button onclick="adicionarNumero" class="numero">5</button>
                <button onclick="adicionarNumero" class="numero">6</button>
                <button id="menos" class="operador">-</button>
            </div>
            <div class="fourth-line">
                <button onclick="adicionarNumero" class="numero">1</button>
                <button onclick="adicionarNumero" class="numero">2</button>
                <button onclick="adicionarNumero" class="numero">3</button>
                <button id="mais" class="operador">+</button>
            </div>
            <div class="fifth">
                <button onclick="adicionarNumero" class="numero">0</button>
                <button id="virgula">,</button>
                <button id="igual" onclick="calcular()">=</button>
            </div>
        </div>
    </div>
</body>
</html>
