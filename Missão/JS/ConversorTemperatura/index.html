<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>
    <h2 id="titulo">Conversor de Temperatura</h2>
    <div class="container">
        <div class="formulario">
        <form>
            <label>Digite a Temperatura:</label> 
            <input type="text" name="" id="valor"> 
    
           <select id="origem">
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
                <option value="K">Kelvin</option>
            </select>

            <select id="destino">
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
                <option value="K">Kelvin</option>
            </select>
        </form>
        </div>  
        <div class="resultado">
            <label for="">Resultado:</label>
            <input type="text" name="" id="resultadoC">
            <input type="text" name="" id="resultadoF">
            <input type="text" name="" id="resultadoK">
        </div>
    </div>
</body>
</html>
