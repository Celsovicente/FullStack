<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <style>
        textarea{
            padding: 10px;
            width: 12%;
        }

        input[type="submit"]{
            padding: 15px;
            border-radius: 5px;
            color: rgb(128, 128, 179);
            background: rgb(237, 237, 213);
        }
    </style>
    <title>Document</title>
</head>
<body>
    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" name="" id="nome" minlength="5"> <br>
        <label for="email">Email:</label> <br>
        <input type="email" name="" id="email"> <br>
        <label for="mensagem">Mensagem:</label><br>
        <textarea name="" id="mensagem"></textarea> <br>
        <input type="submit" value="Enviar" id="enviar">
        <p id="informacao"></p>
    </form>
</body>
</html>
